<!DOCTYPE html>
<html>

<head>
  <base href="/gumlis-checklist/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gumli">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gumli">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Gumli</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Lightweight startup telemetry. Marks are always available to automated
    // diagnostics, while console output is opt-in via ?debug-startup=1.
    (() => {
      const enabled = new URLSearchParams(window.location.search).get('debug-startup') === '1';
      const startedAt = performance.now();
      const marks = {};

      window.gumliStartup = {
        enabled,
        marks,
        mark(name) {
          const elapsed = Math.round((performance.now() - startedAt) * 10) / 10;
          marks[name] = elapsed;
          performance.mark(`gumli:${name}`);
          if (enabled) {
            console.info(`[GUMLI STARTUP] ${name}: ${elapsed} ms`);
          }
          return elapsed;
        },
        snapshot() {
          return { ...marks };
        }
      };

      window.gumliStartup.mark('html-start');
    })();
  </script>

  <script>
    var flet = {
      pyodide: false,
      multiView: false,
      noCdn: false,
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/",
      assetBase: "/",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: "/canvaskit/",
      pyodideUrl: "/pyodide/pyodide.js",
      webRenderer: "auto",
      fontFallbackBaseUrl: "assets/fonts/", // for Noto Emoji, use Google CDN
      appPackageUrl: "app.tar.gz?build=__APP_ARCHIVE_HASH__"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      window.gumliStartup?.mark('flutter-app-ready');
      console.log("Flutter app loaded");
      if (flet.multiView) {
        console.log(flutterApp.addView({
          hostElement: document.querySelector('#view-1'),
          initialData: {
            script: 'print("Hello from view 1")',
            randomValue: Math.floor(Math.random() * 100),
          },
          viewConstraints: {
            //maxWidth: Infinity,
            maxHeight: Infinity,
            minHeight: 300,
            minWidth: 620
          }
        }));
        console.log(flutterApp.addView({
          hostElement: document.querySelector('#view-2'),
          initialData: {
            script: 'print("Hello from view 2")',
            bar: "baz"
          },
          viewConstraints: {
            minWidth: 620,
            //maxWidth: 320,
            //minHeight: 400,
            maxHeight: 400,
          }
        }));
      }
    });
  </script>

  <script>
flet.pyodide = true;
flet.micropipIncludePre = false;
flet.pythonModuleName = "main";
flet.noCdn=false;
flet.webRenderer="auto";
flet.routeUrlStrategy="path";
flet.entrypointBaseUrl="/gumlis-checklist/";
flet.assetBase="/gumlis-checklist/";
</script>

  <script src="python.js"></script>
</head>

<body>
  <div id="loading">
    <style>
      body {
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
      }

      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading img {
        animation: 1s ease-in-out 0s infinite alternate breathe;
        opacity: .66;
        transition: opacity .4s;
      }

      #loading.main_done img {
        opacity: 1;
      }

      #loading.init_done img {
        animation: .33s ease-in-out 0s 1 forwards zooooom;
        opacity: .05;
      }

      @keyframes breathe {
        from {
          transform: scale(0.4);
          opacity: 1.0;
        }

        to {
          transform: scale(0.35);
          opacity: .7;
        }
      }

      @keyframes zooooom {
        from {
          transform: scale(0.4)
        }

        to {
          transform: scale(10)
        }
      }
    </style>
    <img src="icons/loading-animation.png" alt="Loading..." />
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('flutter_service_worker.js').catch((error) => {
          console.error('Gumli service worker registration failed:', error);
        });
      });
    }
  </script>

  <!-- <h1>View 1</h1>
  <div id="view-1" style="display: flex; justify-content: center;"></div>
  <h1>View 2</h1>
  <div id="view-2"></div> -->
</body>
</html>
