  <script>
    // Lightweight startup telemetry. Marks are always available to automated
    // diagnostics, while console output is opt-in via ?debug-startup=1.
    (() => {
      const enabled = new URLSearchParams(window.location.search).get('debug-startup') === '1';
      const startedAt = performance.now();
      const marks = {};

      window.gumliStartup = {
        enabled,
        marks,
        mark(name) {
          const elapsed = Math.round((performance.now() - startedAt) * 10) / 10;
          marks[name] = elapsed;
          performance.mark(`gumli:${name}`);
          if (enabled) {
            console.info(`[GUMLI STARTUP] ${name}: ${elapsed} ms`);
          }
          return elapsed;
        },
        snapshot() {
          return { ...marks };
        }
      };

      window.gumliStartup.mark('html-start');
    })();
  </script>

  <script>
    // Created only after the user opens Familj and makes a request. Normal
    // Privat/Jobb startup therefore performs no family network traffic.
    (() => {
      const apiUrl = 'https://script.google.com/macros/s/AKfycbz0axuelvLf_V7gvxa5C_2QBFj6Jyhaq6QBaTPEd856aMrjhOCNJBMiFc_vqbdSEcl8YA/exec';
      let frame = null;
      let bridgeWindow = null;
      let bridgeOrigin = null;
      let bridgeNonce = null;
      let readyPromise = null;
      let resolveReady = null;
      let rejectReady = null;
      const pending = new Map();
      const debug = {
        frameCreated: false,
        frameLoaded: false,
        ready: false,
        lastError: null,
        lastResponse: null
      };
      window.gumliFamilyDebug = debug;
      const publishDebug = () => {
        document.documentElement.dataset.gumliFamilyDebug = JSON.stringify(debug);
      };
      publishDebug();

      const createBridgeNonce = () => {
        const bytes = crypto.getRandomValues(new Uint8Array(32));
        return Array.from(
          bytes,
          byte => byte.toString(16).padStart(2, '0')
        ).join('');
      };

      const isTrustedAppsScriptSandboxOrigin = (origin) => {
        try {
          const parsedOrigin = new URL(origin);
          return (
            parsedOrigin.protocol === 'https:' &&
            parsedOrigin.port === '' &&
            /^[a-z0-9-]+-script\.googleusercontent\.com$/.test(parsedOrigin.hostname)
          );
        } catch (_error) {
          return false;
        }
      };

      const resetUnreadyFrame = () => {
        const reject = rejectReady;
        frame?.remove();
        frame = null;
        bridgeWindow = null;
        bridgeOrigin = null;
        bridgeNonce = null;
        readyPromise = null;
        resolveReady = null;
        rejectReady = null;
        debug.frameCreated = false;
        debug.frameLoaded = false;
        debug.ready = false;
        publishDebug();
        reject?.(new Error('Family bridge handshake reset'));
      };

      const ensureFrame = () => {
        if (readyPromise) return readyPromise;
        if (window.top !== window.self) {
          throw new Error('Embedded Family bridge is not allowed');
        }
        bridgeNonce = createBridgeNonce();
        readyPromise = new Promise((resolve, reject) => {
          resolveReady = resolve;
          rejectReady = reject;
        });
        frame = document.createElement('iframe');
        const frameUrl = new URL(apiUrl);
        frameUrl.searchParams.set('bridgeNonce', bridgeNonce);
        frame.src = frameUrl.toString();
        frame.title = 'Gumli Familj API';
        frame.hidden = true;
        frame.setAttribute('aria-hidden', 'true');
        frame.addEventListener('load', () => {
          debug.frameLoaded = true;
          publishDebug();
        });
        document.body.appendChild(frame);
        debug.frameCreated = true;
        publishDebug();
        return readyPromise;
      };

      window.addEventListener('message', (event) => {
        const message = event.data;
        if (message?.type === 'gumli-family-ready') {
          if (
            !frame ||
            bridgeWindow ||
            !event.source ||
            message.bridgeNonce !== bridgeNonce ||
            !isTrustedAppsScriptSandboxOrigin(event.origin)
          ) return;
          bridgeWindow = event.source;
          bridgeOrigin = event.origin;
          debug.ready = true;
          publishDebug();
          resolveReady?.();
          resolveReady = null;
          rejectReady = null;
          return;
        }
        if (
          message?.type !== 'gumli-family-response' ||
          event.source !== bridgeWindow ||
          event.origin !== bridgeOrigin ||
          message.bridgeNonce !== bridgeNonce
        ) return;
        debug.lastResponse = {
          ok: Boolean(message.response?.ok),
          error: message.response?.error || null,
          member: message.response?.data?.member || message.response?.member || null
        };
        publishDebug();
        const request = pending.get(message.requestId);
        if (!request) return;
        pending.delete(message.requestId);
        clearTimeout(request.timeout);
        request.worker.postMessage(message);
      });

      window.gumliFamilyBridge = {
        async forward(message, worker) {
          const timeout = setTimeout(() => {
            const request = pending.get(message.requestId);
            if (!request) return;
            pending.delete(message.requestId);
            if (!bridgeWindow && pending.size === 0) resetUnreadyFrame();
            debug.lastError = 'TIMEOUT';
            publishDebug();
            request.worker.postMessage({
              type: 'gumli-family-response',
              requestId: message.requestId,
              response: { ok: false, error: 'TIMEOUT' }
            });
          }, 10000);
          pending.set(message.requestId, { worker, timeout });
          try {
            await ensureFrame();
            if (!pending.has(message.requestId)) return;
            bridgeWindow.postMessage({
              type: 'gumli-family-request',
              bridgeNonce,
              requestId: message.requestId,
              payload: message.payload
            }, bridgeOrigin);
          } catch (_error) {
            const request = pending.get(message.requestId);
            if (!request) return;
            clearTimeout(request.timeout);
            pending.delete(message.requestId);
            debug.lastError = 'BRIDGE_ERROR';
            publishDebug();
            request.worker.postMessage({
              type: 'gumli-family-response',
              requestId: message.requestId,
              response: { ok: false, error: 'BRIDGE_ERROR' }
            });
          }
        }
      };
    })();
  </script>

  <script>
    var flet = {
      pyodide: false,
      multiView: false,
      noCdn: false,
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/",
      assetBase: "/",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: "/canvaskit/",
      pyodideUrl: "/pyodide/pyodide.js",
      webRenderer: "auto",
      fontFallbackBaseUrl: "assets/fonts/", // for Noto Emoji, use Google CDN
      appPackageUrl: "app.tar.gz?build=__APP_ARCHIVE_HASH__"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      window.gumliStartup?.mark('flutter-app-ready');
      console.log("Flutter app loaded");
      if (flet.multiView) {
        console.log(flutterApp.addView({
          hostElement: document.querySelector('#view-1'),
          initialData: {
            script: 'print("Hello from view 1")',
            randomValue: Math.floor(Math.random() * 100),
          },
          viewConstraints: {
            //maxWidth: Infinity,
            maxHeight: Infinity,
            minHeight: 300,
            minWidth: 620
          }
        }));
        console.log(flutterApp.addView({
          hostElement: document.querySelector('#view-2'),
          initialData: {
            script: 'print("Hello from view 2")',
            bar: "baz"
          },
          viewConstraints: {
            minWidth: 620,
            //maxWidth: 320,
            //minHeight: 400,
            maxHeight: 400,
          }
        }));
      }
    });
  </script>

  <script>
flet.pyodide = true;
flet.micropipIncludePre = false;
flet.pythonModuleName = "main";
flet.noCdn=false;
flet.webRenderer="auto";
flet.routeUrlStrategy="path";
flet.entrypointBaseUrl="/gumlis-checklist/";
flet.assetBase="/gumlis-checklist/";
</script>

  <script src="python.js"></script>
</head>

<body>
  <div id="loading">
    <style>
      body {
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
      }

      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading img {
        animation: 1s ease-in-out 0s infinite alternate breathe;
        opacity: .66;
        transition: opacity .4s;
      }

      #loading.main_done img {
        opacity: 1;
      }

      #loading.init_done img {
        animation: .33s ease-in-out 0s 1 forwards zooooom;
        opacity: .05;
      }

      @keyframes breathe {
        from {
          transform: scale(0.4);
          opacity: 1.0;
        }

        to {
          transform: scale(0.35);
          opacity: .7;
        }
      }

      @keyframes zooooom {
        from {
          transform: scale(0.4)
        }

        to {
          transform: scale(10)
        }
      }
    </style>
    <img src="icons/loading-animation.png" alt="Loading..." />
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('flutter_service_worker.js').catch((error) => {
          console.error('Gumli service worker registration failed:', error);
        });
      });
    }
  </script>
