<!doctype html>
<html lang="sv">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <title>Gumli Familj API</title>
  </head>
  <body>
    <script>
      const allowedOrigins = new Set(<?!= allowedOriginsJson ?>);
      const bridgeNonce = <?!= bridgeNonceJson ?>;

      window.addEventListener('message', event => {
        if (event.source !== window.top || !allowedOrigins.has(event.origin)) return;
        const message = event.data;
        if (
          !bridgeNonce ||
          !message ||
          message.type !== 'gumli-family-request' ||
          message.bridgeNonce !== bridgeNonce ||
          !message.requestId
        ) return;

        const reply = response => {
          event.source?.postMessage({
            type: 'gumli-family-response',
            bridgeNonce,
            requestId: message.requestId,
            response,
          }, event.origin);
        };

        google.script.run
          .withSuccessHandler(reply)
          .withFailureHandler(() => reply({ ok: false, error: 'SERVER_ERROR' }))
          .handleRequest(message.payload || {});
      });

      // Apps Script wraps this HTML in its own sandbox iframe. The nonce binds
      // this inner window to the exact frame request created by Gumli.
      for (const origin of allowedOrigins) {
        window.top.postMessage({
          type: 'gumli-family-ready',
          bridgeNonce,
        }, origin);
      }
    </script>
  </body>
</html>
